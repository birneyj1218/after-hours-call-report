name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, mock-provider and workflow simulation tests
        run: npm test
      - name: n8n workflow is in sync with src/
        run: npm run check:workflow
      - name: Demo runs and the committed sample reports are current
        run: |
          npm run demo
          git diff --exit-code -- docs/sample-report.html docs/sample-call-report.html

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with placeholder values
        run: |
          cp .env.example .env
          docker compose config --quiet
